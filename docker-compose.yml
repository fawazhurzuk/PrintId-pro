version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: printid-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - printid-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printid-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/printid-pro
      - JWT_SECRET=printid-pro-production-secret-change-me
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo
    networks:
      - printid-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: printid-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - printid-network

volumes:
  mongo_data:
  uploads_data:

networks:
  printid-network:
    driver: bridge
